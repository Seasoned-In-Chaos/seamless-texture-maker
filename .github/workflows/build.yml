name: Build and Release SEAMS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv-build
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: venv-${{ runner.os }}-py312-

      - name: Create build venv and install dependencies
        shell: cmd
        run: |
          python -m venv .venv-build
          call .venv-build\Scripts\activate.bat
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pyinstaller packaging

      - name: Run automated tests
        shell: cmd
        run: |
          call .venv-build\Scripts\activate.bat
          pip install --quiet pytest
          python -m pytest -q

      - name: Install UPX
        shell: pwsh
        run: choco install upx --yes

      - name: Build with PyInstaller
        shell: cmd
        run: |
          call .venv-build\Scripts\activate.bat
          where upx >nul 2>&1 && for /f "tokens=*" %%u in ('where upx') do set "UPX=%%u"
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Build installer with Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAMS-windows
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SEAMS_Setup*.exe
            dist/SEAMS.exe
          name: SEAMS ${{ github.ref_name }}
          generate_release_notes: true
